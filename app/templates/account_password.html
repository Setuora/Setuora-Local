<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password - Setuora</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css?v=20260710-table-fonts-3">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <div>
        <h1>Change your password</h1>
        {% if forced %}
        <p class="muted" style="margin-top:8px">For security, set a new password before continuing.</p>
        {% else %}
        <p class="muted" style="margin-top:8px">Update the password for {{ user.username }}.</p>
        {% endif %}
      </div>
      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/account/password" class="stack">
        <label>Current password
          <span class="password-field" data-password-field>
            <input name="current_password" type="password" autocomplete="current-password" required autofocus>
            <button class="button small ghost" type="button" data-password-toggle aria-pressed="false">Show</button>
          </span>
        </label>
        <label>New password
          <span class="password-field" data-password-field>
            <input name="new_password" type="password" autocomplete="new-password" minlength="8" required>
            <button class="button small ghost" type="button" data-password-toggle aria-pressed="false">Show</button>
          </span>
        </label>
        <label>Confirm new password
          <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="button primary full" type="submit">Update password</button>
      </form>
      {% if not forced %}
      <form method="post" action="/logout" class="stack" style="margin-top:8px">
        <a class="button small ghost" href="/">Back</a>
      </form>
      {% endif %}
    </section>
  </main>
  <script src="/static/password-toggle.js?v=20260626-scanfix-1"></script>
</body>
</html>
